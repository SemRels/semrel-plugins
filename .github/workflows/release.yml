# .github/workflows/release.yml
# Automated release workflow for semrel-plugins.
# On every push to main, semrel determines whether a new version is warranted,
# cuts a tag, and triggers a registry sync via repository_dispatch.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"

      - name: Install semrel
        run: |
          go install github.com/SemRels/semrel/cmd/semrel@v0.24.0

      - name: Configure git identity
        run: |
          git config user.name  "semrel-bot"
          git config user.email "semrel-bot@users.noreply.github.com"

      - name: Run semrel release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semrel release --github-output
        # semrel writes SEMREL_RELEASED=true and SEMREL_VERSION=X.Y.Z to $GITHUB_OUTPUT
        # when a new version is released.

      - name: Notify registry
        if: steps.semrel.outputs.SEMREL_RELEASED == 'true'
        env:
          REGISTRY_WEBHOOK_SECRET: ${{ secrets.REGISTRY_WEBHOOK_SECRET }}
          SEMREL_VERSION: ${{ steps.semrel.outputs.SEMREL_VERSION }}
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${REGISTRY_WEBHOOK_SECRET}" \
            -d "{
              \"action\": \"release\",
              \"plugin\": {
                \"name\": \"semrel-plugins\",
                \"namespace\": \"@semrel\",
                \"version\": \"${SEMREL_VERSION}\",
                \"repository\": \"https://github.com/${{ github.repository }}\"
              }
            }" \
            "${SEMREL_REGISTRY_URL:-https://registry.semrel.io}/api/v1/webhooks/release"
