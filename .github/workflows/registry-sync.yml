# .github/workflows/registry-sync.yml
# Manual or scheduled registry sync — updates all plugin metadata in the registry
# to match the current state of each official plugin repository.
name: Registry Sync

on:
  schedule:
    # Run daily at 02:00 UTC to pick up any plugin releases that bypassed the webhook.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not apply changes)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger registry org sync
        env:
          REGISTRY_ADMIN_TOKEN: ${{ secrets.REGISTRY_ADMIN_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${REGISTRY_ADMIN_TOKEN}" \
            -d "{\"dryRun\": ${DRY_RUN}}" \
            "${SEMREL_REGISTRY_URL:-https://registry.semrel.io}/api/v1/admin/sync-github-org"
